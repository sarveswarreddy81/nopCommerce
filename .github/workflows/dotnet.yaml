name: MyDotNet Project CI/CD

on:
  push:
    branches:
      - develop

jobs:
  dotnet-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Docker Image
        run: |
         aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 903874537457.dkr.ecr.eu-north-1.amazonaws.com
          VERSION=1.0.${{ github.run_number }}
          docker build -t mydotnetapp:${VERSION} .
          docker tag mydotnetapp:1.0 903874537457.dkr.ecr.eu-north-1.amazonaws.com/mydummypod:latest
          docker push 903874537457.dkr.ecr.eu-north-1.amazonaws.com/mydummypod:latest

      - name: Configure kubectl with kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Deploy to Kubernetes
        run:
          kubectl apply -f .
          kubectl get po
